*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

a{color:var(--acc)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap}
nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--mute);font-size:14px;white-space:nowrap}
nav a:hover,nav a.on{background:var(--accsoft);color:var(--acc)}
.tools button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:14px}
main{max-width:1040px;margin:auto;padding:0 16px}
section{padding:48px 0 8px}
h1{font-size:clamp(34px,7vw,56px);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
h2{font-size:28px;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 20px;max-width:62ch}
.hero{display:grid;grid-template-columns:1fr 280px;gap:32px;align-items:center;padding-top:40px}
.tag{color:var(--acc);font-weight:600;margin:0 0 10px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600;border:1px solid var(--acc);color:var(--acc);background:transparent}
.btn.p{background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#0a1126}}
:root[data-theme="dark"] .btn.p{color:#0a1126}
.ph{background:var(--ph);border:1.5px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-size:13px;padding:10px;aspect-ratio:4/3}
.ph.sq{aspect-ratio:1}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:4px 0 0;font-size:18px}
.card p{margin:0;color:var(--mute);font-size:15px}
.meta{font-size:13px;color:var(--mute)}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--accsoft);color:var(--acc);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filters button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit;font-size:14px}
.filters button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .filters button[aria-pressed="true"]{color:#0a1126}}
:root[data-theme="dark"] .filters button[aria-pressed="true"]{color:#0a1126}
.tl{border-left:2px solid var(--line);margin:0;padding:0 0 0 18px;list-style:none}
.tl li{position:relative;padding:0 0 16px}
.tl li::before{content:"";position:absolute;left:-25px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl b{display:block}
.note{background:var(--accsoft);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink);margin:12px 0}
.empty{color:var(--mute);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px}
details.card summary{cursor:pointer;font-weight:600}
footer{max-width:1040px;margin:48px auto 24px;padding:20px 16px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.logo span{display:none}}
</style>

 const ps=DATA.projects.filter(p=>cat==="all"||p.cat===cat);
 $("#pg").innerHTML=ps.length?ps.map(p=>`<article class="card">${ph(p.img,t(T.noPhoto))}<span class="chip">${t(CATS[p.cat])}</span><h3>${esc(p.name)}</h3><span class="meta">${t(T.role)}: ${t(p.role)}${p.period?" · "+p.period:""}</span><p>${t(p.desc)}</p><span class="meta"><b>${t(T.status)}:</b> ${t(p.status)}${t(p.result)?" · "+t(p.result):""}</span></article>`).join(""):`<div class="empty">${t(T.none)}</div>`;
 $("#ag").innerHTML=DATA.achievements.map(a=>`<article class="card"><h3>${t(a.t)}</h3><p>${t(a.d)}</p></article>`).join("");
 $("#eg").innerHTML=DATA.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<li><b>${t(e.t)}</b><span class="meta">${e.dl}</span><p class="sub" style="margin:2px 0 0">${t(e.d)}</p></li>`).join("");
 $("#mg").innerHTML=DATA.mun.map(m=>`<article class="card">${ph("",t(T.noPhoto))}<h3>${m.name}</h3><span class="meta">${m.date||"—"}</span><p>${t(m.c)}</p></article>`).join("");
 $("#vg").innerHTML=DATA.vol.map(v=>`<article class="card"><h3>${typeof v.n==="string"?v.n:t(v.n)}</h3><p>${t(v.d)}</p></article>`).join("");
 $("#gg").innerHTML=GALLERY.length?GALLERY.map(g=>`<figure class="card" style="margin:0">${ph(g.img,t(g.t))}<span class="meta">${t(g.t)} · ${g.d||""}</span></figure>`).join(""):Array.from({length:3},()=>ph("",t(T.noPhoto))).join("");
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b){cat=b.dataset.c;render()}});
$("#lang").onclick=()=>{lang=lang==="tr"?"en":"tr";try{localStorage.setItem("lang",lang)}catch(e){}render()};
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
render();
</script>
</body>
</html>
